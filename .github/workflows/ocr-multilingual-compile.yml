name: Multilingual Comic OCR compile

on:
  push:
    branches:
      - feature/stylized-multilingual-comic-ocr
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ocr-multilingual-compile.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Android debug APK
        run: gradle :app:assembleDebug --no-daemon
