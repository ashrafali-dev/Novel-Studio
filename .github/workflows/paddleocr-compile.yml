name: PaddleOCR integration build and tests

on:
  push:
    branches:
      - feature/paddleocr-complete-pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare existing NovelStudio release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub Secret is missing; refusing to create a different signing key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/novelstudio-release.jks"
          test -s "$RUNNER_TEMP/novelstudio-release.jks"

      - name: Run unit tests
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/novelstudio-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle app:testDebugUnitTest --no-daemon

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/novelstudio-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle app:assembleRelease --no-daemon

      - name: Upload signed ARM64 APK (most modern Android phones)
        uses: actions/upload-artifact@v4
        with:
          name: NovelStudio-PaddleOCR-arm64-v8a-signed
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed ARMv7 APK (older 32-bit ARM phones)
        uses: actions/upload-artifact@v4
        with:
          name: NovelStudio-PaddleOCR-armeabi-v7a-signed
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14
