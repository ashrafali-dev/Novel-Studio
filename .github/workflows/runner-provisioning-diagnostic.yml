name: Temporary runner provisioning diagnostic

on:
  push:
    branches:
      - fix/analytics-dashboard-hosting
    paths:
      - '.github/workflows/runner-provisioning-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub-hosted runner starts
        run: |
          echo "RUNNER_STARTED"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
