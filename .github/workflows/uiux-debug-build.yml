name: UI UX branch debug build

on:
  push:
    branches:
      - uiux/genspark-reader-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile debug APK
        # app/build.gradle validates release signing variables even for assembleDebug.
        # These placeholders satisfy configuration only; the debug variant never signs with them.
        env:
          KEYSTORE_FILE: /tmp/not-used-for-debug.jks
          KEYSTORE_PASSWORD: debug-only-placeholder
          KEY_ALIAS: debug-only-placeholder
          KEY_PASSWORD: debug-only-placeholder
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NovelStudio-UIUX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
