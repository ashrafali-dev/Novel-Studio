name: Verify (tests + build)

# Cheap, remote verification for every change: unit tests first, then a signed release build.
# Runs in parallel with the existing "Build APK" workflow and never publishes anything.
on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/ocr-cache-inpaint-perf-20261024'
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # app/build.gradle refuses to evaluate without the release signing variables. Unit tests never
      # sign anything, so a throwaway keystore generated here is enough; the real key is only used by
      # the "Signed release build" job below.
      - name: Provide throwaway signing config for project evaluation
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/unit-test-only.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass unit-test -keypass unit-test \
            -alias unit-test -keyalg RSA -keysize 2048 -validity 1 -dname "CN=unit-test"
          {
            echo "KEYSTORE_FILE=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=unit-test"
            echo "KEY_ALIAS=unit-test"
            echo "KEY_PASSWORD=unit-test"
          } >> "$GITHUB_ENV"

      - name: Run JVM unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  assemble:
    name: Signed release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable GitHub Secret is missing."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/novelstudio-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/novelstudio-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

  paddle-models:
    name: PaddleOCR model validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ONNX Runtime (metadata only)
        run: pip install --quiet onnxruntime

      # Downloads the pinned model files once on the runner (never on the phone) and checks that the
      # app's hardcoded SHA-256 values, the CTC class count and the 48 px input height are consistent.
      - name: Validate pinned PaddleOCR packs
        run: bash tools/check_paddle_models.sh "$RUNNER_TEMP/paddle-check"
