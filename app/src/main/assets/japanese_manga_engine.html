<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NovelStudio Japanese Manga OCR</title>
<style>html,body{margin:0;background:#10131c;color:#d9deeb;font:14px sans-serif}#state{padding:8px}</style>
<script src="https://appassets.androidplatform.net/manga-engine/ort.wasm.min.js"></script>
</head>
<body><div id="state">Initializing optional manga OCR runtime…</div>
<script>
(function () {
  'use strict';
  const BASE = 'https://appassets.androidplatform.net/manga-engine/';
  let detector = null, recognizer = null, dictionary = null, busy = false, readySignalled = false;
  const state = document.getElementById('state');
  function bridge(name, id, message) {
    try {
      const b = window.NsJapaneseMangaBridge;
      if (b && typeof b[name] === 'function') {
        if (message === undefined) b[name](String(id || ''));
        else b[name](String(id || ''), String(message));
      }
    } catch (_) {}
  }

  async function loadModels(withDetector) {
    if (!window.ort) throw new Error('ONNX Runtime WASM could not load');
    ort.env.wasm.wasmPaths = {
      mjs: BASE + 'ort-wasm-simd-threaded.mjs',
      wasm: BASE + 'ort-wasm-simd-threaded.wasm'
    };
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.proxy = false;
    // The normal reader path only needs text recognition on crops already detected by the app.
    // Keep the detector lazy-loaded for the optional stand-alone diagnostic screen only.
    if (!recognizer) recognizer = await ort.InferenceSession.create(BASE + 'rec/manga_rec_v0.2.onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    if (withDetector && !detector) detector = await ort.InferenceSession.create(BASE + 'det/manga_det_v0.2.onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    if (!dictionary) {
      const response = await fetch(BASE + 'ppocrv6_dict.txt');
      if (!response.ok) throw new Error('Character dictionary unavailable (' + response.status + ')');
      const rows = (await response.text()).replace(/^\uFEFF/, '').split(/\r?\n/);
      while (rows.length && rows[rows.length - 1] === '') rows.pop();
      dictionary = [''];
      for (const row of rows) dictionary.push(row.replace(/\r$/, ''));
      dictionary.push(' ');
      if (dictionary.length < 10000) throw new Error('Character dictionary is incomplete');
    }
    state.textContent = withDetector ? 'Japanese manga OCR ready' : 'Japanese manga text recognizer ready';
    if (!readySignalled) {
      readySignalled = true;
      try { if (window.NsJapaneseMangaBridge) window.NsJapaneseMangaBridge.onReady(); } catch (_) {}
    }
  }

  function canvasOf(width, height) {
    const c = document.createElement('canvas'); c.width = width; c.height = height; return c;
  }

  function detectorInput(image) {
    const W = image.naturalWidth, H = image.naturalHeight;
    const longStrip = Math.max(H, W) / Math.max(1, Math.min(H, W)) > 2;
    const ratio = longStrip ? Math.min(1, Math.sqrt(0.75 * 960 * 960 / (H * W))) : 960 / Math.max(H, W);
    const rh = Math.max(32, Math.round(H * ratio / 32) * 32);
    const rw = Math.max(32, Math.round(W * ratio / 32) * 32);
    const canvas = canvasOf(rw, rh);
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(image, 0, 0, rw, rh);
    const rgba = ctx.getImageData(0, 0, rw, rh).data;
    const plane = rw * rh, data = new Float32Array(3 * plane);
    // The model's reference path reads BGR pixels and applies these per-channel statistics.
    const mean = [0.485,0.456,0.406], std = [0.229,0.224,0.225];
    for (let i=0,p=0; i<rgba.length; i+=4,p++) {
      data[p] = (rgba[i+2]/255-mean[0])/std[0];
      data[plane+p] = (rgba[i+1]/255-mean[1])/std[1];
      data[2*plane+p] = (rgba[i]/255-mean[2])/std[2];
    }
    return {tensor:new ort.Tensor('float32', data, [1,3,rh,rw]), rw,rh,W,H};
  }

  function toArgb(r,g,b) {
    return (0xFF000000 | (Math.round(r)<<16) | (Math.round(g)<<8) | Math.round(b)) | 0;
  }

  // Sample the pixels immediately around the detected lettering. Bubble pages are usually
  // black ink on white paper; sampled colour helps the overlay cover the original glyphs.
  function sampleColors(image, box) {
    const iw=image.naturalWidth, ih=image.naturalHeight;
    const pad=Math.max(3,Math.min(14,Math.round(Math.min(box.w,box.h)*0.16)));
    const x0=Math.max(0,Math.floor(box.x)-pad), y0=Math.max(0,Math.floor(box.y)-pad);
    const x1=Math.min(iw,Math.ceil(box.x+box.w)+pad), y1=Math.min(ih,Math.ceil(box.y+box.h)+pad);
    const cw=Math.max(1,x1-x0), ch=Math.max(1,y1-y0);
    const canvas=canvasOf(cw,ch),ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(image,x0,y0,cw,ch,0,0,cw,ch);
    const pixels=ctx.getImageData(0,0,cw,ch).data;
    const left=Math.max(0,Math.min(cw-1,Math.floor(box.x)-x0));
    const top=Math.max(0,Math.min(ch-1,Math.floor(box.y)-y0));
    const right=Math.max(left,Math.min(cw-1,Math.ceil(box.x+box.w)-x0));
    const bottom=Math.max(top,Math.min(ch-1,Math.ceil(box.y+box.h)-y0));
    const border=[];
    function addBorder(x,y) {
      x=Math.round(x);y=Math.round(y);
      if(x<0||y<0||x>=cw||y>=ch)return;
      const at=(y*cw+x)*4;
      border.push([pixels[at],pixels[at+1],pixels[at+2]]);
    }
    for(let k=0;k<=6;k++){
      const fx=k/6;
      addBorder(left+(right-left)*fx,top-pad/2);
      addBorder(left+(right-left)*fx,bottom+pad/2);
      addBorder(left-pad/2,top+(bottom-top)*fx);
      addBorder(right+pad/2,top+(bottom-top)*fx);
    }
    function medianChannel(at) {
      if(!border.length)return 255;
      const values=border.map(p=>p[at]).sort((a,b)=>a-b);
      return values[Math.floor(values.length/2)];
    }
    const br=medianChannel(0), bgc=medianChannel(1), bb=medianChannel(2);
    const luma=0.2126*br+0.7152*bgc+0.0722*bb;
    const chroma=Math.max(br,bgc,bb)-Math.min(br,bgc,bb);
    // Foreground ink may be black on white OR white on black. Select pixels that
    // contrast with the sampled background instead of assuming all lettering is dark.
    const ink=[];
    const strideX=Math.max(1,Math.floor((right-left)/24));
    const strideY=Math.max(1,Math.floor((bottom-top)/24));
    for(let y=top;y<=bottom;y+=strideY)for(let x=left;x<=right;x+=strideX){
      const at=(y*cw+x)*4,r=pixels[at],g=pixels[at+1],b=pixels[at+2];
      const contrast=(Math.abs(r-br)+Math.abs(g-bgc)+Math.abs(b-bb))/3;
      if(contrast>=Math.max(52,chroma*0.55))ink.push([r,g,b]);
    }
    let fr=20,fg=20,fb=20;
    if(ink.length){
      fr=ink.reduce((a,p)=>a+p[0],0)/ink.length;
      fg=ink.reduce((a,p)=>a+p[1],0)/ink.length;
      fb=ink.reduce((a,p)=>a+p[2],0)/ink.length;
    }
    const spread=border.length ? border.reduce((sum,p)=>sum+(Math.abs(p[0]-br)+Math.abs(p[1]-bgc)+Math.abs(p[2]-bb))/3,0)/border.length : 255;
    // "soft" now means an uncertain/variegated background, not simply a dark or coloured bubble.
    // This lets the pixel cleaner safely process flat dark speech balloons with white lettering.
    return {bg:toArgb(br,bgc,bb),fg:toArgb(fr,fg,fb),soft:(spread>38||ink.length===0)};
  }

  function detectComponents(map, mh, mw, input) {
    const visited = new Uint8Array(mh*mw), boxes = [];
    for (let start=0; start<map.length && boxes.length<5000; start++) {
      if (visited[start] || map[start]<=0.15) continue;
      const stack=[start]; visited[start]=1;
      let minX=mw,minY=mh,maxX=-1,maxY=-1,sum=0,count=0;
      while (stack.length) {
        const at=stack.pop(), y=(at/mw)|0, x=at-y*mw;
        minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
        sum+=map[at];count++;
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) {
          if(!dx&&!dy) continue;
          const nx=x+dx,ny=y+dy;
          if(nx<0||ny<0||nx>=mw||ny>=mh) continue;
          const ni=ny*mw+nx;
          if(!visited[ni]&&map[ni]>0.15){visited[ni]=1;stack.push(ni);}
        }
      }
      if(count<3||maxX-minX+1<3||maxY-minY+1<3||sum/count<0.25) continue;
      // Map pixels are downsampled from detector input: coordinate scale is source dimension / map dimension.
      const sx=input.W/mw, sy=input.H/mh;
      let x=minX*sx,y=minY*sy,w=(maxX-minX+1)*sx,h=(maxY-minY+1)*sy;
      // Rectangle approximation of DBPostProcess unclip: distance ~= area * ratio / perimeter.
      const pad=Math.max(1,(w*h*0.7)/Math.max(1,w+h));
      x=Math.max(0,x-pad);y=Math.max(0,y-pad);
      w=Math.min(input.W-x,w+2*pad);h=Math.min(input.H-y,h+2*pad);
      boxes.push({x,y,w,h,score:sum/count});
    }
    // DB threshold maps can fragment adjacent glyphs. Merge only nearby same-line or same-column components.
    boxes.sort((a,b)=>(a.y-b.y)||(a.x-b.x));
    let changed=true,passes=0;
    while(changed&&passes++<50){
      changed=false;
      for(let i=0;i<boxes.length;i++){
        for(let j=i+1;j<boxes.length;){
          const a=boxes[i],b=boxes[j];
          const xo=Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x));
          const yo=Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
          const gx=Math.max(0,Math.max(a.x,b.x)-Math.min(a.x+a.w,b.x+b.w));
          const gy=Math.max(0,Math.max(a.y,b.y)-Math.min(a.y+a.h,b.y+b.h));
          // Use the short box dimension as a glyph-size estimate. Using a merged line's full height
          // made the gap threshold grow after every merge and could combine neighbouring columns.
          const fa=Math.max(3,Math.min(a.w,a.h)),fb=Math.max(3,Math.min(b.w,b.h)),font=Math.max(fa,fb);
          const minH=Math.min(a.h,b.h),minW=Math.min(a.w,b.w);
          const verticalPair=a.h>a.w*1.8&&b.h>b.w*1.8;
          const horizontalPair=a.w>a.h*1.8&&b.w>b.h*1.8;
          const rowAligned=(yo>minH*0.25||Math.abs(a.y+a.h/2-b.y-b.h/2)<font*0.8)&&gx<font*2.2;
          const colAligned=(xo>minW*0.25||Math.abs(a.x+a.w/2-b.x-b.w/2)<font*0.8)&&gy<font*2.2;
          // A complete vertical column must not be merged sideways just because its neighbour
          // overlaps in Y; that turns several Japanese columns into one unreadable horizontal crop.
          // Likewise, stacked horizontal lines stay separate for the later bubble-level grouping.
          const row=verticalPair?false:rowAligned;
          const col=horizontalPair?false:(verticalPair
            ? xo>minW*0.25&&gy<font*2.2&&yo<minH*0.15
            : colAligned);
          if(!row&&!col){j++;continue;}
          const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),r=Math.max(a.x+a.w,b.x+b.w),bt=Math.max(a.y+a.h,b.y+b.h);
          boxes[i]={x,y,w:r-x,h:bt-y,score:(a.score+b.score)/2};
          boxes.splice(j,1);changed=true;
        }
      }
    }
    return boxes.filter(b=>b.w>=4&&b.h>=4).slice(0,250);
  }

  async function detect(image) {
    const input=detectorInput(image);
    const out=await detector.run({[detector.inputNames[0]]:input.tensor});
    const tensor=out[detector.outputNames[0]],dims=tensor.dims,data=tensor.data;
    const mh=dims[dims.length-2],mw=dims[dims.length-1];
    if(!mh||!mw||data.length<mh*mw) throw new Error('Unexpected detector output '+JSON.stringify(dims));
    return detectComponents(data,mh,mw,input).map(b=>({...b,vertical:b.h>b.w*1.2}));
  }

  async function recognize(image, box) {
    const x=Math.max(0,Math.floor(box.x)),y=Math.max(0,Math.floor(box.y));
    const w=Math.min(image.naturalWidth-x,Math.max(1,Math.ceil(box.w)));
    const h=Math.min(image.naturalHeight-y,Math.max(1,Math.ceil(box.h)));
    if(w<2||h<2)return '';
    let crop=canvasOf(w,h);
    crop.getContext('2d').drawImage(image,x,y,w,h,0,0,w,h);
    if(h>w){
      const rotated=canvasOf(h,w),ctx=rotated.getContext('2d');
      ctx.translate(0,rotated.height);ctx.rotate(-Math.PI/2);ctx.drawImage(crop,0,0);crop=rotated;
    }
    const naturalW=Math.round(48*crop.width/Math.max(1,crop.height));
    const tw=Math.max(16,Math.min(naturalW>2000?2400:640,naturalW));
    const small=canvasOf(tw,48),ctx=small.getContext('2d',{willReadFrequently:true});
    ctx.fillStyle='#fff';ctx.fillRect(0,0,tw,48);ctx.drawImage(crop,0,0,tw,48);
    const rgba=ctx.getImageData(0,0,tw,48).data,plane=tw*48,arr=new Float32Array(3*plane);
    for(let i=0,p=0;i<rgba.length;i+=4,p++){
      arr[p]=rgba[i+2]/127.5-1;arr[plane+p]=rgba[i+1]/127.5-1;arr[2*plane+p]=rgba[i]/127.5-1;
    }
    const out=await recognizer.run({[recognizer.inputNames[0]]:new ort.Tensor('float32',arr,[1,3,48,tw])});
    const tensor=out[recognizer.outputNames[0]],dims=tensor.dims;
    if(dims.length<3)throw new Error('Unexpected recognizer output '+JSON.stringify(dims));
    const steps=dims[dims.length-2],vocab=dims[dims.length-1],values=tensor.data;
    let prev=-1,text='';
    for(let t=0;t<steps;t++){
      let best=0,bestValue=-Infinity,offset=t*vocab;
      for(let k=0;k<vocab;k++){const v=values[offset+k];if(v>bestValue){bestValue=v;best=k;}}
      if(best!==0&&best!==prev&&dictionary[best]!==undefined)text+=dictionary[best];
      prev=best;
    }
    return text.trim();
  }


  // Convert detector text-line boxes into complete manga speech-bubble units.
  // PP-OCR detects lettering; bubble grouping is a separate page-layout task.
  function groupIntoBubbles(image, regions) {
    if (!regions || !regions.length) return [];
    const items = regions.filter(r => r && r.text && r.w >= 4 && r.h >= 4).map((r, i) => ({
      ...r, _i:i,
      _font:Math.max(5,Math.min(r.w,r.h)),
      _vertical:!!r.vertical || r.h > r.w * 1.18
    }));
    const n=items.length, parent=Array.from({length:n},(_,i)=>i), size=Array(n).fill(1);
    function root(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
    function join(a,b){a=root(a);b=root(b);if(a===b)return;if(size[a]<size[b]){const t=a;a=b;b=t;}parent[b]=a;size[a]+=size[b];}
    function color(c){return [((c>>>16)&255),((c>>>8)&255),(c&255)];}
    function colorGap(a,b){const x=color(a||0xFFFFFFFF),y=color(b||0xFFFFFFFF);return (Math.abs(x[0]-y[0])+Math.abs(x[1]-y[1])+Math.abs(x[2]-y[2]))/3;}
    function overlap(a0,a1,b0,b1){return Math.max(0,Math.min(a1,b1)-Math.max(a0,b0));}
    function edgeBetween(a,b,vertical,font) {
      // Look for a continuous balloon edge between otherwise-neighbouring text boxes.
      // The sampled strip is bounded to keep memory and work suitable for a phone.
      const gap=vertical ? Math.max(0,Math.max(a.x,b.x)-Math.min(a.x+a.w,b.x+b.w))
                        : Math.max(0,Math.max(a.y,b.y)-Math.min(a.y+a.h,b.y+b.h));
      if(gap<2 || gap>font*2.1) return false;
      const lo=vertical ? Math.max(a.y,b.y) : Math.max(a.x,b.x);
      const hi=vertical ? Math.min(a.y+a.h,b.y+b.h) : Math.min(a.x+a.w,b.x+b.w);
      const span=hi-lo;
      if(span<font*1.2) return false;
      const cross=Math.min(Math.round(gap),vertical?160:160);
      const along=Math.min(Math.round(span*0.7),360);
      if(cross<2 || along<8) return false;
      const x0=vertical?Math.max(0,Math.floor(Math.min(a.x+a.w,b.x+b.w))):Math.max(0,Math.floor(lo+span*0.15));
      const y0=vertical?Math.max(0,Math.floor(lo+span*0.15)):Math.max(0,Math.floor(Math.min(a.y+a.h,b.y+b.h)));
      const cw=vertical?Math.min(cross,Math.max(1,image.naturalWidth-x0)):Math.min(along,Math.max(1,image.naturalWidth-x0));
      const ch=vertical?Math.min(along,Math.max(1,image.naturalHeight-y0)):Math.min(cross,Math.max(1,image.naturalHeight-y0));
      if(cw<2||ch<2||cw*ch>60000)return false;
      try {
        const c=canvasOf(cw,ch),ctx=c.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(image,x0,y0,cw,ch,0,0,cw,ch);
        const p=ctx.getImageData(0,0,cw,ch).data;
        const bg=color(a.bg||b.bg||0xFFFFFFFF);
        // Count continuous dark/light edge candidates (bubble outline) across most of the strip.
        const crossN=vertical?cw:ch, alongN=vertical?ch:cw;
        const step=Math.max(1,Math.floor(alongN/48));
        for(let q=0;q<crossN;q++){
          let hit=0,total=0;
          for(let z=1;z<alongN-1;z+=step){
            const xx=vertical?q:z, yy=vertical?z:q, at=(yy*cw+xx)*4;
            const d=(Math.abs(p[at]-bg[0])+Math.abs(p[at+1]-bg[1])+Math.abs(p[at+2]-bg[2]))/3;
            if(d>68)hit++;total++;
          }
          if(total>=8&&hit/total>0.72)return true;
        }
      } catch(_) {}
      return false;
    }
    for(let i=0;i<n;i++){
      const a=items[i];
      for(let j=i+1;j<n;j++){
        const b=items[j];
        if(a._vertical!==b._vertical)continue;
        const fa=a._font,fb=b._font,font=Math.max(fa,fb);
        if(Math.min(fa,fb)/font<0.48 || Math.max(fa,fb)/font>2.1)continue;
        if(colorGap(a.bg,b.bg)>46)continue;
        // Do not group dark, outlined effects into a dialogue balloon unless their backgrounds agree.
        if(!!a.soft!==!!b.soft && (a.soft||b.soft))continue;
        if(a._vertical){
          const gx=Math.max(0,Math.max(a.x,b.x)-Math.min(a.x+a.w,b.x+b.w));
          const oy=overlap(a.y,a.y+a.h,b.y,b.y+b.h);
          const minH=Math.min(a.h,b.h);
          const centerY=Math.abs((a.y+a.h/2)-(b.y+b.h/2));
          if(gx>font*2.35)continue;
          if(oy<Math.max(font*1.05,minH*0.22) && centerY>Math.max(font*2.0,minH*0.45))continue;
          if(edgeBetween(a,b,true,font))continue;
          join(i,j);
        }else{
          const gy=Math.max(0,Math.max(a.y,b.y)-Math.min(a.y+a.h,b.y+b.h));
          const ox=overlap(a.x,a.x+a.w,b.x,b.x+b.w);
          const minW=Math.min(a.w,b.w);
          const centerX=Math.abs((a.x+a.w/2)-(b.x+b.w/2));
          const closeSameLine=gy<=font*0.78 && centerX<=Math.max(a.w,b.w)*1.1;
          const stacked=gy<=font*1.55 && ox>=minW*0.22 && centerX<=Math.max(a.w,b.w)*0.72;
          if(!closeSameLine&&!stacked)continue;
          if(edgeBetween(a,b,false,font))continue;
          join(i,j);
        }
      }
    }
    const groups=new Map();
    for(let i=0;i<n;i++){const k=root(i);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(items[i]);}
    const out=[];
    for(const group of groups.values()){
      const vertical=group.filter(r=>r._vertical).length>group.length*0.45;
      group.sort(vertical ? (a,b)=>(b.x-a.x)||(a.y-b.y) : (a,b)=>(a.y-b.y)||(a.x-b.x));
      const jp=group.some(r=>/[\u3040-\u30ff\u31f0-\u31ff\u3400-\u9fff\uff66-\uff9d]/.test(r.text));
      const text=group.map(r=>String(r.text||'').replace(/\s+/g,' ').trim()).filter(Boolean).join(jp?'':' ').trim();
      if(!text)continue;
      const l=Math.min(...group.map(r=>r.x)),t=Math.min(...group.map(r=>r.y));
      const rr=Math.max(...group.map(r=>r.x+r.w)),bb=Math.max(...group.map(r=>r.y+r.h));
      const glyphs=group.map(r=>r._font).sort((a,b)=>a-b);
      const font=glyphs[Math.floor(glyphs.length/2)]||Math.min(rr-l,bb-t);
      const pad=Math.min(Math.max(3,Math.round(font*0.16)),Math.max(3,Math.round(Math.min(image.naturalWidth,image.naturalHeight)*0.008)));
      const x=Math.max(0,Math.floor(l-pad)),y=Math.max(0,Math.floor(t-pad));
      const right=Math.min(image.naturalWidth,Math.ceil(rr+pad)),bottom=Math.min(image.naturalHeight,Math.ceil(bb+pad));
      const bg=group[Math.floor(group.length/2)].bg||0xFFFFFFFF;
      const fg=group[Math.floor(group.length/2)].fg||0xFF171717;
      out.push({order:0,text,x,y,w:Math.max(1,right-x),h:Math.max(1,bottom-y),
        vertical:vertical,score:group.reduce((s,r)=>s+(Number(r.score)||0),0)/group.length,
        font:font,bg:bg,fg:fg,soft:group.filter(r=>!!r.soft).length>group.length*0.5,regionCount:group.length,
        members:group.map(r=>r.order||r._i+1)});
    }
    out.sort((a,b)=>a.y-b.y||b.x-a.x);
    out.forEach((b,i)=>b.order=i+1);
    return out;
  }

  async function run(url,id,regionsJson) {
    if(busy){bridge('onOcrError',id,'একটি OCR কাজ চলছে।');return;}
    busy=true;
    try{
      const recognitionOnly = typeof regionsJson === 'string' && regionsJson.length > 0;
      await loadModels(!recognitionOnly);
      const image=new Image();image.decoding='async';image.src=url;
      await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('Local panel image could not load'));});

      if (recognitionOnly) {
        // Geometry originates from the app's default OCR blocks. This mode cannot create, merge,
        // move, or resize blocks; it returns only the recognised string for each supplied index.
        const requested=JSON.parse(regionsJson);
        if(!Array.isArray(requested)||requested.length>128)throw new Error('Invalid manga recognition regions');
        const results=[];
        for(const b of requested){
          let text='';
          try{text=await recognize(image,b);}catch(_){}
          results.push({index:Number(b.index),text:text});
        }
        bridge('onOcrResult',id,JSON.stringify({results:results}));
        return;
      }

      // Legacy manual test screen only: it can still run the model's detector for a standalone
      // comparison. Normal NovelStudio scanning uses runJapaneseMangaRecognitionOnly above.
      const boxes=await detect(image),regions=[];
      for(const b of boxes){
        let text='';
        try{text=await recognize(image,b);}catch(_){}
        if(text)regions.push({order:0,text,x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h),vertical:!!b.vertical,score:Math.round((b.score||0)*1000)/1000,...sampleColors(image,b)});
      }
      const vertical=regions.filter(r=>r.vertical).length>regions.length*0.45;
      regions.sort((a,b)=>{
        if(vertical){const dx=b.x-a.x;return Math.abs(dx)>Math.max(a.w,b.w)*0.55?dx:a.y-b.y;}
        const dy=a.y-b.y;return Math.abs(dy)>Math.max(a.h,b.h)*0.7?dy:b.x-a.x;
      });
      regions.forEach((r,i)=>r.order=i+1);
      const bubbles=groupIntoBubbles(image,regions);
      bridge('onOcrResult',id,JSON.stringify({width:image.naturalWidth,height:image.naturalHeight,verticalReading:vertical,regions:regions,bubbles:bubbles}));
    }catch(e){bridge('onOcrError',id,e&&e.message?e.message:String(e));}
    finally{busy=false;}
  }

  window.runJapaneseMangaOcr=run;
  window.runJapaneseMangaRecognitionOnly=function(url,id,regionsJson){return run(url,id,regionsJson);};
  // Warm only the recognizer when the hidden runtime is created, to reduce initial RAM/CPU use.
  loadModels(false).catch(e=>{
    state.textContent='Runtime/model initialization failed: '+(e&&e.message?e.message:String(e));
    try{if(window.NsJapaneseMangaBridge)window.NsJapaneseMangaBridge.onRuntimeError(state.textContent);}catch(_){}
  });
})();
</script></body></html>
