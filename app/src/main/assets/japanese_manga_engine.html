<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NovelStudio Multilingual Comic OCR</title>
<style>html,body{margin:0;background:#10131c;color:#d9deeb;font:14px sans-serif}#state{padding:8px}</style>
<script src="https://appassets.androidplatform.net/manga-engine/ort.wasm.min.js"></script>
</head>
<body><div id="state">Initializing optional manga OCR runtime…</div>
<script>
(function () {
  'use strict';
  const BASE = 'https://appassets.androidplatform.net/manga-engine/';
  let detector = null, recognizer = null, dictionary = null, koreanRecognizer = null, koreanDictionary = null, busy = false, readySignalled = false;
  const state = document.getElementById('state');
  function bridge(name, id, message) {
    try {
      const b = window.NsJapaneseMangaBridge;
      if (b && typeof b[name] === 'function') {
        if (message === undefined) b[name](String(id || ''));
        else b[name](String(id || ''), String(message));
      }
    } catch (_) {}
  }

  async function loadModels() {
    if (!window.ort) throw new Error('ONNX Runtime WASM could not load');
    ort.env.wasm.wasmPaths = {
      mjs: BASE + 'ort-wasm-simd-threaded.mjs',
      wasm: BASE + 'ort-wasm-simd-threaded.wasm'
    };
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.proxy = false;
    if (!detector) detector = await ort.InferenceSession.create(BASE + 'det/manga_det_v0.2.onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    if (!recognizer) recognizer = await ort.InferenceSession.create(BASE + 'rec/manga_rec_v0.2.onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    if (!dictionary) {
      const response = await fetch(BASE + 'ppocrv6_dict.txt');
      if (!response.ok) throw new Error('Character dictionary unavailable (' + response.status + ')');
      const rows = (await response.text()).replace(/^\uFEFF/, '').split(/\r?\n/);
      while (rows.length && rows[rows.length - 1] === '') rows.pop();
      dictionary = [''];
      for (const row of rows) dictionary.push(row.replace(/\r$/, ''));
      dictionary.push(' ');
      if (dictionary.length < 10000) throw new Error('Character dictionary is incomplete');
    }
    state.textContent = 'Multilingual comic OCR ready (Japanese / Chinese / Korean)';
    if (!readySignalled) {
      readySignalled = true;
      try { if (window.NsJapaneseMangaBridge) window.NsJapaneseMangaBridge.onReady(); } catch (_) {}
    }
  }

  async function loadKoreanModels() {
    if (!window.ort) throw new Error('ONNX Runtime WASM could not load');
    if (!koreanRecognizer) {
      koreanRecognizer = await ort.InferenceSession.create(
        BASE + 'rec/korean_PP-OCRv5_mobile_rec.onnx',
        { executionProviders: ['wasm'], graphOptimizationLevel: 'all' }
      );
    }
    if (!koreanDictionary) {
      const response = await fetch(BASE + 'korean_dict.txt');
      if (!response.ok) throw new Error('Korean character dictionary unavailable (' + response.status + ')');
      const rows = (await response.text()).replace(/^\uFEFF/, '').split(/\r?\n/);
      while (rows.length && rows[rows.length - 1] === '') rows.pop();
      koreanDictionary = [''];
      for (const row of rows) koreanDictionary.push(row.replace(/\r$/, ''));
      koreanDictionary.push(' ');
      if (koreanDictionary.length < 1000) throw new Error('Korean character dictionary is incomplete');
    }
  }

  function canvasOf(width, height) {
    const c = document.createElement('canvas'); c.width = width; c.height = height; return c;
  }

  function detectorInput(image) {
    const W = image.naturalWidth, H = image.naturalHeight;
    const longStrip = Math.max(H, W) / Math.max(1, Math.min(H, W)) > 2;
    const ratio = longStrip ? Math.min(1, Math.sqrt(0.75 * 960 * 960 / (H * W))) : 960 / Math.max(H, W);
    const rh = Math.max(32, Math.round(H * ratio / 32) * 32);
    const rw = Math.max(32, Math.round(W * ratio / 32) * 32);
    const canvas = canvasOf(rw, rh);
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(image, 0, 0, rw, rh);
    const rgba = ctx.getImageData(0, 0, rw, rh).data;
    const plane = rw * rh, data = new Float32Array(3 * plane);
    // The model's reference path reads BGR pixels and applies these per-channel statistics.
    const mean = [0.485,0.456,0.406], std = [0.229,0.224,0.225];
    for (let i=0,p=0; i<rgba.length; i+=4,p++) {
      data[p] = (rgba[i+2]/255-mean[0])/std[0];
      data[plane+p] = (rgba[i+1]/255-mean[1])/std[1];
      data[2*plane+p] = (rgba[i]/255-mean[2])/std[2];
    }
    return {tensor:new ort.Tensor('float32', data, [1,3,rh,rw]), rw,rh,W,H};
  }

  function toArgb(r,g,b) {
    return (0xFF000000 | (Math.round(r)<<16) | (Math.round(g)<<8) | Math.round(b)) | 0;
  }

  // Sample the pixels immediately around the detected lettering. Bubble pages are usually
  // black ink on white paper; sampled colour helps the overlay cover the original glyphs.
  function sampleColors(image, box) {
    const iw=image.naturalWidth, ih=image.naturalHeight;
    const pad=Math.max(3,Math.min(14,Math.round(Math.min(box.w,box.h)*0.16)));
    const x0=Math.max(0,Math.floor(box.x)-pad), y0=Math.max(0,Math.floor(box.y)-pad);
    const x1=Math.min(iw,Math.ceil(box.x+box.w)+pad), y1=Math.min(ih,Math.ceil(box.y+box.h)+pad);
    const cw=Math.max(1,x1-x0), ch=Math.max(1,y1-y0);
    const canvas=canvasOf(cw,ch),ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(image,x0,y0,cw,ch,0,0,cw,ch);
    const pixels=ctx.getImageData(0,0,cw,ch).data;
    const left=Math.max(0,Math.min(cw-1,Math.floor(box.x)-x0));
    const top=Math.max(0,Math.min(ch-1,Math.floor(box.y)-y0));
    const right=Math.max(left,Math.min(cw-1,Math.ceil(box.x+box.w)-x0));
    const bottom=Math.max(top,Math.min(ch-1,Math.ceil(box.y+box.h)-y0));
    const border=[];
    function addBorder(x,y) {
      x=Math.round(x);y=Math.round(y);
      if(x<0||y<0||x>=cw||y>=ch)return;
      const at=(y*cw+x)*4;
      border.push([pixels[at],pixels[at+1],pixels[at+2]]);
    }
    for(let k=0;k<=6;k++){
      const fx=k/6;
      addBorder(left+(right-left)*fx,top-pad/2);
      addBorder(left+(right-left)*fx,bottom+pad/2);
      addBorder(left-pad/2,top+(bottom-top)*fx);
      addBorder(right+pad/2,top+(bottom-top)*fx);
    }
    function medianChannel(at) {
      if(!border.length)return 255;
      const values=border.map(p=>p[at]).sort((a,b)=>a-b);
      return values[Math.floor(values.length/2)];
    }
    const br=medianChannel(0), bgc=medianChannel(1), bb=medianChannel(2);
    const luma=0.2126*br+0.7152*bgc+0.0722*bb;
    const chroma=Math.max(br,bgc,bb)-Math.min(br,bgc,bb);
    const dark=[];
    const strideX=Math.max(1,Math.floor((right-left)/18));
    const strideY=Math.max(1,Math.floor((bottom-top)/18));
    for(let y=top;y<=bottom;y+=strideY)for(let x=left;x<=right;x+=strideX){
      const at=(y*cw+x)*4,r=pixels[at],g=pixels[at+1],b=pixels[at+2];
      const lum=0.2126*r+0.7152*g+0.0722*b;
      if(lum<Math.max(80,luma*0.58))dark.push([r,g,b]);
    }
    let fr=20,fg=20,fb=20;
    if(dark.length){
      fr=dark.reduce((a,p)=>a+p[0],0)/dark.length;
      fg=dark.reduce((a,p)=>a+p[1],0)/dark.length;
      fb=dark.reduce((a,p)=>a+p[2],0)/dark.length;
    }
    return {bg:toArgb(br,bgc,bb),fg:toArgb(fr,fg,fb),soft:(luma<150||chroma>38)};
  }

  // Keep the large probability map compact while handing it to the native OpenCV DBPostProcess
  // implementation. Android is little-endian; ONNX Runtime Web returns Float32Array output.
  function float32MapToBase64(values) {
    if (!(values instanceof Float32Array)) throw new Error('Detector output is not float32');
    const bytes = new Uint8Array(values.buffer, values.byteOffset, values.byteLength);
    let binary = '';
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(bytes.length, i + chunkSize)));
    }
    return btoa(binary);
  }

  async function detect(image) {
    const input = detectorInput(image);
    const out = await detector.run({[detector.inputNames[0]]: input.tensor});
    const tensor = out[detector.outputNames[0]], dims = tensor.dims, data = tensor.data;
    const mh = dims[dims.length - 2], mw = dims[dims.length - 1];
    if (!mh || !mw || data.length !== mh * mw) throw new Error('Unexpected detector output ' + JSON.stringify(dims));
    const payload = JSON.stringify({
      mh, mw, rw: input.rw, rh: input.rh, W: input.W, H: input.H,
      mapB64: float32MapToBase64(data)
    });
    const bridge = window.NsJapaneseMangaBridge;
    if (!bridge || typeof bridge.postProcessDetectorMap !== 'function')
      throw new Error('Native DB postprocessor is unavailable');
    const response = bridge.postProcessDetectorMap(payload);
    if (!response) throw new Error('Native DB postprocessor returned no result');
    const parsed = JSON.parse(response);
    if (parsed.error) throw new Error(parsed.error);
    if (!Array.isArray(parsed.boxes)) throw new Error('Native DB postprocessor returned invalid boxes');
    return parsed.boxes.map(b => ({...b, vertical: b.h > b.w * 1.2}));
  }

  async function recognize(image, box, script) {
    const x=Math.max(0,Math.floor(box.x)),y=Math.max(0,Math.floor(box.y));
    const w=Math.min(image.naturalWidth-x,Math.max(1,Math.ceil(box.w)));
    const h=Math.min(image.naturalHeight-y,Math.max(1,Math.ceil(box.h)));
    if(w<2||h<2)return {text:'',confidence:0};
    let crop=canvasOf(w,h);
    crop.getContext('2d').drawImage(image,x,y,w,h,0,0,w,h);
    if(h>w){
      const rotated=canvasOf(h,w),ctx=rotated.getContext('2d');
      ctx.translate(0,rotated.height);ctx.rotate(-Math.PI/2);ctx.drawImage(crop,0,0);crop=rotated;
    }
    const naturalW=Math.round(48*crop.width/Math.max(1,crop.height));
    const tw=Math.max(16,Math.min(naturalW>2000?2400:640,naturalW));
    const small=canvasOf(tw,48),ctx=small.getContext('2d',{willReadFrequently:true});
    ctx.fillStyle='#fff';ctx.fillRect(0,0,tw,48);ctx.drawImage(crop,0,0,tw,48);
    const rgba=ctx.getImageData(0,0,tw,48).data,plane=tw*48,arr=new Float32Array(3*plane);
    for(let i=0,p=0;i<rgba.length;i+=4,p++){
      arr[p]=rgba[i+2]/127.5-1;arr[plane+p]=rgba[i+1]/127.5-1;arr[2*plane+p]=rgba[i]/127.5-1;
    }
    const activeRecognizer = script === 'KOREAN' ? koreanRecognizer : recognizer;
    const activeDictionary = script === 'KOREAN' ? koreanDictionary : dictionary;
    const out=await activeRecognizer.run({[activeRecognizer.inputNames[0]]:new ort.Tensor('float32',arr,[1,3,48,tw])});
    const tensor=out[activeRecognizer.outputNames[0]],dims=tensor.dims;
    if(dims.length<3)throw new Error('Unexpected recognizer output '+JSON.stringify(dims));
    const steps=dims[dims.length-2],vocab=dims[dims.length-1],values=tensor.data;
    if(vocab!==activeDictionary.length)throw new Error('Recognizer/dictionary mismatch for '+script+': model='+vocab+' dictionary='+activeDictionary.length);
    let prev=-1,text='',confidenceTotal=0,confidenceCount=0;
    for(let t=0;t<steps;t++){
      let best=0,bestValue=-Infinity,offset=t*vocab,rowSum=0,minValue=Infinity;
      for(let k=0;k<vocab;k++){
        const v=values[offset+k];
        rowSum+=v;minValue=Math.min(minValue,v);
        if(v>bestValue){bestValue=v;best=k;}
      }
      if(best!==0&&best!==prev&&activeDictionary[best]!==undefined){
        // Some exports return softmax probabilities, others return logits. Normalize only logits so the
        // geometry/text fusion receives a meaningful 0..1 confidence instead of every logit >1 being clamped to 1.
        let confidence=bestValue;
        if(minValue < -1e-6 || Math.abs(rowSum-1)>0.05){
          let expSum=0;
          for(let k=0;k<vocab;k++)expSum+=Math.exp(values[offset+k]-bestValue);
          confidence=expSum>0?1/expSum:0;
        }
        text+=activeDictionary[best];confidenceTotal+=confidence;confidenceCount++;
      }
      prev=best;
    }
    return {text:text.trim(),confidence:confidenceCount?Math.max(0,Math.min(1,confidenceTotal/confidenceCount)):0};
  }

  async function run(url,id,requestedScript) {
    const candidate = String(requestedScript || 'JAPANESE').toUpperCase();
    const script = ['JAPANESE','CHINESE','KOREAN'].includes(candidate) ? candidate : 'JAPANESE';
    if(busy){bridge('onOcrError',id,'একটি OCR কাজ চলছে।');return;}
    busy=true;
    try{
      await loadModels();
      if(script==='KOREAN') await loadKoreanModels();
      const image=new Image();image.decoding='async';image.src=url;
      await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('Local panel image could not load'));});
      const boxes=await detect(image),regions=[];
      let lastRecognitionError='';
      for(const b of boxes){
        let reading=null;
        try{reading=await recognize(image,b,script);}
        catch(e){lastRecognitionError=e&&e.message?e.message:String(e);}
        if(reading&&reading.text)regions.push({order:0,text:reading.text,recConfidence:reading.confidence,x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h),vertical:!!b.vertical,score:Math.round((b.score||0)*1000)/1000,...sampleColors(image,b)});
      }
      // Do not silently report an empty success when every crop failed because the ONNX output and dictionary
      // do not agree (for example, after a corrupt/incompatible model download).
      if(boxes.length>0&&regions.length===0&&lastRecognitionError)
        throw new Error('All detected regions failed recognition: '+lastRecognitionError);
      const vertical=regions.filter(r=>r.vertical).length>regions.length*0.45;
      regions.sort((a,b)=>{
        if(vertical){const dx=b.x-a.x;return Math.abs(dx)>Math.max(a.w,b.w)*0.55?dx:a.y-b.y;}
        const dy=a.y-b.y;return Math.abs(dy)>Math.max(a.h,b.h)*0.7?dy:b.x-a.x;
      });
      regions.forEach((r,i)=>r.order=i+1);
      bridge('onOcrResult',id,JSON.stringify({width:image.naturalWidth,height:image.naturalHeight,verticalReading:vertical,regions:regions}));
    }catch(e){bridge('onOcrError',id,e&&e.message?e.message:String(e));}
    finally{busy=false;}
  }

  // Keep the old bridge name for older screens; the runtime now supports three scripts.
  window.runJapaneseMangaOcr=run;
  window.runMultilingualComicOcr=run;
  loadModels().catch(e=>{
    state.textContent='Runtime/model initialization failed: '+(e&&e.message?e.message:String(e));
    try{if(window.NsJapaneseMangaBridge)window.NsJapaneseMangaBridge.onRuntimeError(state.textContent);}catch(_){}
  });
})();
</script></body></html>
