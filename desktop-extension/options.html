<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovelStudio OCR Settings</title><style>body{font:15px/1.5 system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 18px;color:#202124}h1{font-size:24px}fieldset{border:1px solid #dadce0;border-radius:10px;margin:18px 0;padding:16px}label{display:block;margin:10px 0}select,input{padding:7px;font:inherit}button{padding:9px 14px;margin:8px 8px 8px 0;cursor:pointer}#status{min-height:1.5em;color:#137333}.note{color:#5f6368;font-size:13px}</style></head><body><h1>NovelStudio OCR — Settings</h1><p>Live overlay OCR for image-heavy pages. Google Lens upload is an unofficial endpoint and can change.</p><fieldset><legend>Translation</legend><label>Translate to <select id="targetLanguage"><option value="bn">বাংলা (Bengali)</option><option value="en">English</option><option value="ja">Japanese</option><option value="ko">Korean</option><option value="zh-CN">Chinese (Simplified)</option><option value="zh-TW">Chinese (Traditional)</option><option value="hi">Hindi</option><option value="ar">Arabic</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option><option value="ru">Russian</option><option value="th">Thai</option><option value="vi">Vietnamese</option><option value="id">Indonesian</option><option value="tr">Turkish</option></select></label><label><input id="enabled" type="checkbox"> Enable live overlay by default</label></fieldset><fieldset><legend>Performance</legend><label>Images per batch <input id="batchSize" type="number" min="1" max="12" value="4"></label><label>Batch wait (ms) <input id="batchDelayMs" type="number" min="250" max="10000" step="250" value="900"></label><label>Minimum image width (px) <input id="minImageWidth" type="number" min="80" max="2000" value="220"></label><label>Minimum image height (px) <input id="minImageHeight" type="number" min="40" max="2000" value="90"></label><label><input id="cacheEnabled" type="checkbox" checked> Cache OCR + translation results for 7 days</label><p class="note">Larger batches reduce repeated work but can delay the first overlay.</p></fieldset><button id="save">Save settings</button><button id="clearCache">Clear OCR cache</button><div id="status" role="status"></div><script src="options.js"></script></body></html>
